<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PvP Арена: {{ room_name }}</title>
    <style>
        :root {
            --primary: #6f42c1;
            --secondary: #4e73df;
            --success: #1cc88a;
            --info: #36b9cc;
            --warning: #f6c23e;
            --danger: #e74a3b;
            --dark: #2c3e50;
            --light: #f8f9fc;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--light);
            margin: 0;
            padding: 20px;
            color: var(--dark);
        }

        .arena-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
        }

        /* Панель игроков */
        .header-stats {
            grid-column: 1 / 3;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 10px;
        }

        .player-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        .player-box.me { border-bottom: 5px solid var(--primary); }
        .player-box.enemy { border-bottom: 5px solid var(--danger); }

        .player-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .player-name { font-weight: 800; font-size: 1.2rem; }
        .score-val { font-size: 1.5rem; font-weight: bold; color: var(--primary); }

        .progress-container {
            background: #eaecf4;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            transition: width 0.5s ease;
        }

        /* Игровая зона */
        .game-area {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        .task-card {
            flex-grow: 1;
            background: #fdfdfe;
            border: 2px dashed #d1d3e2;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 15px;
            border: 2px solid #eaecf4;
            border-radius: 10px;
            outline: none;
            font-size: 1rem;
        }

        input[type="text"]:focus { border-color: var(--primary); }

        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 30px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover { background: #5a32a3; }

        /* Чат и Логи */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chat-box {
            background: var(--dark);
            color: white;
            border-radius: 15px;
            height: 500px;
            display: flex;
            flex-direction: column;
        }

        #chat-log {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg { padding: 8px 12px; border-radius: 8px; background: #3e4f5f; max-width: 85%; }
        .msg.system { background: rgba(246, 194, 62, 0.2); color: var(--warning); border: 1px solid var(--warning); align-self: center; }

        .chat-input {
            padding: 15px;
            background: #23272b;
            border-radius: 0 0 15px 15px;
        }

        .chat-input input {
            background: #3a3b45;
            border: none;
            color: white;
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="arena-wrapper">
    <div class="header-stats">
        <div class="player-box me">
            <div class="player-info">
                <span class="player-name">🔵 {{ user.username }} (Вы)</span>
                <span class="score-val" id="my-score">0</span>
            </div>
            <div class="progress-container">
                <div id="my-progress" class="progress-bar" style="width: 0%; background: var(--primary);"></div>
            </div>
        </div>
        <div class="player-box enemy">
            <div class="player-info">
                <span class="player-name" id="enemy-name">🔴 Ожидание...</span>
                <span class="score-val" id="enemy-score">0</span>
            </div>
            <div class="progress-container">
                <div id="enemy-progress" class="progress-bar" style="width: 0%; background: var(--danger);"></div>
            </div>
        </div>
    </div>

    <div class="game-area">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0;">Задание: <span id="task-title">Подключение...</span></h3>
            <span id="room-id" style="color: #b7b9cc;">ID: {{ room_name }}</span>
        </div>

        <div class="task-card" id="task-body">
            Ожидание второго игрока для синхронизации заданий. Битва начнется автоматически...
        </div>

        <div class="input-group">
            <input type="text" id="answer-input" placeholder="Введите ответ...">
            <button class="btn-submit" id="btn-answer">ОТПРАВИТЬ</button>
        </div>
    </div>

    <div class="side-panel">
        <div class="chat-box">
            <div style="padding: 15px; border-bottom: 1px solid #4e73df; font-weight: bold; font-size: 0.8rem; letter-spacing: 1px;">ЛОГ МАТЧА</div>
            <div id="chat-log"></div>
            <div class="chat-input">
                <input type="text" id="chat-message-input" placeholder="Написать в чат...">
            </div>
        </div>
    </div>
</div>

{{ room_name|json_script:"room-name" }}

<script>
    const roomName = JSON.parse(document.getElementById('room-name').textContent);
    const userName = "{{ user.username }}";

    const chatSocket = new WebSocket(
        'ws://' + window.location.host + '/ws/pvp/' + roomName + '/'
    );

    function addLog(message, type = 'user', user = '') {
        const log = document.querySelector('#chat-log');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        if (type === 'system') {
            div.innerHTML = `⚙️ ${message}`;
        } else {
            div.innerHTML = `<b>${user}:</b> ${message}`;
        }
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
    }

    chatSocket.onmessage = function(e) {
        const data = JSON.parse(e.data);

        // Обработка сообщений чата
        if (data.message && !data.type) {
            addLog(data.message, 'user', data.username);
        }

        // Пример обработки системных данных (нужно настроить в consumers.py)
        if (data.type === 'game_update') {
            document.getElementById('task-title').innerText = data.task_title;
            document.getElementById('task-body').innerText = data.task_desc;
            addLog("Новое задание получено!", 'system');
        }

        if (data.type === 'score_update') {
            if (data.username === userName) {
                document.getElementById('my-score').innerText = data.score;
                document.getElementById('my-progress').style.width = data.progress + '%';
            } else {
                document.getElementById('enemy-name').innerText = "🔴 " + data.username;
                document.getElementById('enemy-score').innerText = data.score;
                document.getElementById('enemy-progress').style.width = data.progress + '%';
            }
        }
    };

    document.querySelector('#btn-answer').onclick = function() {
        const input = document.querySelector('#answer-input');
        chatSocket.send(JSON.stringify({
            'message': "отправил ответ: " + input.value,
            'username': userName,
            'action': 'submit_answer'
        }));
        input.value = '';
    };

    document.querySelector('#chat-message-input').onkeyup = function(e) {
        if (e.keyCode === 13) {
            chatSocket.send(JSON.stringify({
                'message': e.target.value,
                'username': userName
            }));
            e.target.value = '';
        }
    };
</script>
</body>
</html>
