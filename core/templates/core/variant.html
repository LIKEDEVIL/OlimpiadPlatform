{% extends 'core/base.html' %}

{% block content %}
<div class="mb-8">
    <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Ваш случайный вариант</h1>
    <p class="text-slate-500">Система подобрала задачи для тренировки</p>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for task in tasks %}
    <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm hover:shadow-md transition">
        <h3 class="text-xl font-bold text-slate-800 mb-2">{{ task.title }}</h3>
        <p class="text-slate-600 text-sm mb-6 leading-relaxed">{{ task.description|truncatewords:15 }}</p>
        <a href="{% url 'solve_task' task.id %}" class="block w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold text-center hover:bg-indigo-700 transition">
            Решить
        </a>
    </div>
    {% empty %}
    <p>Задач не найдено.</p>
    {% endfor %}
</div>

<div class="mt-8">
    <a href="{% url 'task_list' %}" class="text-indigo-600 font-semibold hover:underline">
        <i class="fas fa-arrow-left"></i> Вернуться к списку
    </a>
</div>
{% endblock %}
