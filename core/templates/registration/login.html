{% extends 'core/base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="bg-white rounded-[2.5rem] p-10 border border-slate-100 shadow-xl shadow-slate-200/50">
        <h2 class="text-3xl font-black text-slate-800 mb-2 text-center">С возвращением!</h2>
        <p class="text-slate-400 text-center mb-8 font-medium">Входи в систему и начинай решать</p>

        {% if form.errors %}
            <div class="bg-red-50 border-2 border-red-100 text-red-600 px-5 py-3 rounded-2xl text-xs font-black mb-6 uppercase tracking-tight">
                Неверный логин или пароль
            </div>
        {% endif %}

        <form method="post" class="space-y-5">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Логин</label>
                <input type="text" name="username" required
                       class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl px-5 py-4 font-bold outline-none focus:border-indigo-500 transition-all">
            </div>
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Пароль</label>
                <input type="password" name="password" required
                       class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl px-5 py-4 font-bold outline-none focus:border-indigo-500 transition-all">
            </div>

            <button type="submit" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-bold hover:bg-indigo-600 transition-all shadow-lg mt-4">
                Войти в профиль
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-slate-400 text-sm font-bold">Еще нет аккаунта?</p>
            <a href="{% url 'register' %}" class="text-indigo-600 font-black text-sm uppercase tracking-tighter hover:underline">Создать профиль</a>
        </div>
    </div>
</div>
{% endblock %}
